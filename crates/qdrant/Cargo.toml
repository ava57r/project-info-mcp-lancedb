[package]
name = "piim-qdrant"
version = "0.4.0"
edition = "2024"

[features]
fastembed = ["piim-common/fastembed"]

[dependencies]
piim-common = { path = "../common" }

anyhow = "1.0"
kameo = "0.22"
serde_json = "1.0"
async-trait = "0.1"
tokio-stream = "0.1"
qdrant-client = "1.19"
uuid = { version = "1.27", features = ["v4"] }
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.13", features = ["json"] }
rust-mcp-sdk = { version = "2.0", features = ["stdio", "server"] }
