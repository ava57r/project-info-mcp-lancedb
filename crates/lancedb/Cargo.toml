[package]
name = "piim-lance"
version = "0.1.0"
edition = "2024"

[dependencies]
piim-common = { path = "../common" }

axum = "0.8.9"
kameo = "0.22"
tar = "0.4.46"
flate2 = "1.1.10"
arrow-array = "58"
serde_json = "1.0"
arrow-schema = "58"
async-trait = "0.1"
tokio-stream = "0.1"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.13", features = ["json"] }
chrono = { version = "0.4.45", features = ["serde"] }
tower-http = { version = "0.6", features = ["cors"] }
lancedb = { version = "0.40.0", features = ["remote"] }
rust-mcp-sdk = { version = "2.0", features = ["stdio", "server"] }
