[package]
name = "piim-lance"
version = "0.1.0"
edition = "2024"

[dependencies]
piim-common = { path = "../common" }
arrow-array = "58"
arrow-schema = "58"
async-trait = "0.1"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
flate2 = "1.1.10"
kameo = "0.22"
lancedb = { version = "0.40.0", features = ["remote"] }
rust-mcp-sdk = { version = "2.0", features = ["stdio", "server"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4.46"
tokio = { version = "1.38", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors"] }
