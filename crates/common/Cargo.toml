[package]
name = "piim-common"
version = "0.2.0"
edition = "2024"

[features]
default = []
fastembed = ["dep:candle-core", "dep:fastembed"]

[dependencies]
dirs = "6"
hex = "0.4"
sha2 = "0.11"
anyhow = "1.0"
kameo = "0.22"
serde_json = "1.0"
async-trait = "0.1"
candle-core = { version = "0.11", optional = true }
serde = { version = "1.0", features = ["derive"] }
fastembed = { version = "7", features = ["qwen3"], optional = true }
reqwest = { version = "0.13", features = ["json"] }
rust-mcp-sdk = { version = "2.0", features = ["stdio", "server"] }
