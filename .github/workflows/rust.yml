name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        feature_set:
          - --features default
          - --no-default-features --features qdrant_store

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Protoc
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler
    - name: Build
      run: cargo build --verbose ${{ matrix.feature_set }}
    - name: Run tests
      run: cargo test --verbose ${{ matrix.feature_set }}
